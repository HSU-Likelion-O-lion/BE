# 테스트 전용 설정 (프로필: test)
# 실제 DB 없이 메모리에서 도는 H2 사용 → 어디서든(CI 포함) 빠르게 실행
spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL   # 메모리 H2, PostgreSQL 호환 모드
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop   # 테스트 시작 시 테이블 생성, 끝나면 삭제
    database-platform: org.hibernate.dialect.H2Dialect
  mail:
    host: localhost   # 테스트에서는 실제 발송 안 함, 빈 생성용 더미 값

jwt:
  secret: test-only-secret-key-not-for-real-use-please-32bytes-minimum
  access-token-validity-ms: 1800000
  refresh-token-validity-ms: 1209600000

file:
  upload-dir: ./build/test-uploads
