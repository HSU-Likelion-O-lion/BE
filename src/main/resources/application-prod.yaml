spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      # 운영 스키마는 Flyway 마이그레이션으로만 변경한다.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

# CORS 허용 오리진(프론트가 뜨는 주소). 비밀값이 아니라 여기 직접 나열한다.
# SecurityConfig 의 setAllowedOrigins 는 정확 일치라 와일드카드가 통하지 않는다 → 주소를 그대로 적는다.
# 커스텀 도메인 연결 전후 주소를 모두 넣어둬서, 프론트가 도메인을 붙일 때 백엔드 재배포가 필요 없게 한다.
app:
  cors:
    # 쉼표로 구분한 정확한 오리진 목록. 자격 증명 사용으로 와일드카드는 허용하지 않는다.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  public-pages:
    support-url: ${PUBLIC_SUPPORT_URL}
    terms-url: ${PUBLIC_TERMS_URL}
    privacy-policy-url: ${PUBLIC_PRIVACY_POLICY_URL}

server:
  # 호스트 nginx가 넘긴 X-Forwarded-Proto를 신뢰 → 앱이 요청을 https로 인식(스웨거/리다이렉트 URL 깨짐 방지)
  forward-headers-strategy: framework
