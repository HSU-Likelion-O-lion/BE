spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      # Flyway 마이그레이션이 신규 설치용 전체 스키마 생성을 아직 커버하지 않아
      # (기존 운영 DB에 대한 증분 변경만 있음), 최초 스키마는 Hibernate가 생성하도록 임시로 update 사용.
      # 스키마가 안정되면 전체 스키마 baseline 마이그레이션 추가 후 validate로 전환 권장.
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

  flyway:
    # 신규 설치 시 V2 마이그레이션이 존재하지 않는 테이블(users)을 ALTER하려다 실패하므로 비활성화.
    # 전체 스키마 baseline 마이그레이션이 추가되면 다시 활성화.
    enabled: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-ms: 1800000   # 30분
  refresh-token-validity-ms: 1209600000  # 14일

# 프로필 이미지 등 파일 업로드 저장 경로 (배포 서버 로컬 디스크, 추후 S3로 교체 예정)
file:
  upload-dir: ${FILE_UPLOAD_DIR:/app/uploads}

reflection-share:
  storage: s3
  presigned-url-minutes: ${AWS_S3_PRESIGNED_URL_MINUTES:10}

aws:
  s3:
    access-key: ${AWS_S3_ACCESS_KEY}
    secret-key: ${AWS_S3_SECRET_KEY}
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_S3_REGION}

# 도서 검색 외부 API (카카오 우선, 실패 시 알라딘, 둘 다 안 되면 내부 DB)
book:
  api:
    kakao:
      rest-api-key: ${KAKAO_REST_API_KEY:}
    aladin:
      ttb-key: ${ALADIN_TTB_KEY:}

# CORS 허용 오리진(프론트가 뜨는 주소). 비밀값이 아니라 여기 직접 나열한다.
# SecurityConfig 의 setAllowedOrigins 는 정확 일치라 와일드카드가 통하지 않는다 → 주소를 그대로 적는다.
# 커스텀 도메인 연결 전후 주소를 모두 넣어둬서, 프론트가 도메인을 붙일 때 백엔드 재배포가 필요 없게 한다.
app:
  cors:
    # 쉼표로 구분한 정확한 오리진 목록. 자격 증명 사용으로 와일드카드는 허용하지 않는다.
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  public-pages:
    support-url: ${PUBLIC_SUPPORT_URL}
    terms-url: ${PUBLIC_TERMS_URL}
    privacy-policy-url: ${PUBLIC_PRIVACY_POLICY_URL}
  # 독서 세션 타이머 스킵을 허용할 테스트 계정 이메일 (쉼표로 구분, 시연/테스트 전용)
  reading:
    timer-skip-emails: ${TIMER_SKIP_EMAILS:}

server:
  # 호스트 nginx가 넘긴 X-Forwarded-Proto를 신뢰 → 앱이 요청을 https로 인식(스웨거/리다이렉트 URL 깨짐 방지)
  forward-headers-strategy: framework
