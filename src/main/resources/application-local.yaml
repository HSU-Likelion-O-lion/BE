# 로컬 개발 환경 설정 (프로필: local)
# docker-compose.yml 로 띄운 PostgreSQL 에 접속
spring:
  datasource:
    url: ${LOCAL_DB_URL:jdbc:postgresql://localhost:5433/olion}   # localhost:5433 = 도커가 열어준 포트
    username: ${LOCAL_DB_USERNAME:olion}  # 기본값 olion = docker-compose 의 POSTGRES_USER
    password: ${LOCAL_DB_PASSWORD:olion}  # 기본값 olion = docker-compose 의 POSTGRES_PASSWORD
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update      # 엔티티 기준으로 테이블 자동 생성/변경 (개발 초기 편의용)
    show-sql: true          # 실행되는 SQL 을 콘솔에 출력
