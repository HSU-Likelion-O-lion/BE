# 배포 서버용 설정 (앱 + PostgreSQL을 함께 띄움)
# 실행:  docker compose -f docker-compose.prod.yml up -d --build
# 종료:  docker compose -f docker-compose.prod.yml down
#
# 같은 디렉터리에 .env 파일을 만들어서 아래 환경변수 값을 채워둬야 한다 (git에 올리지 않음).

services:
  db:
    image: postgres:16
    container_name: olion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: olion
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - olion-db-data:/var/lib/postgresql/data

  app:
    build: .
    container_name: olion-app
    restart: unless-stopped
    depends_on:
      - db
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/olion
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY}
      ALADIN_TTB_KEY: ${ALADIN_TTB_KEY}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}
      PUBLIC_SUPPORT_URL: ${PUBLIC_SUPPORT_URL}
      PUBLIC_TERMS_URL: ${PUBLIC_TERMS_URL}
      PUBLIC_PRIVACY_POLICY_URL: ${PUBLIC_PRIVACY_POLICY_URL}
      TIMER_SKIP_EMAILS: ${TIMER_SKIP_EMAILS:-}
      AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY:-}
      AWS_S3_SECRET_KEY: ${AWS_S3_SECRET_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_REGION: ${AWS_S3_REGION:-}
    ports:
      - "8080:8080"
    volumes:
      - olion-uploads:/app/uploads

volumes:
  olion-db-data:
  olion-uploads:
