# 로컬 개발용 PostgreSQL 컨테이너 설정
# 실행:  docker compose up -d   (백그라운드로 DB 켜기)
# 종료:  docker compose down    (DB 끄기, 데이터는 유지됨)

services:
  db:
    image: postgres:16                # PostgreSQL 16 이미지 사용
    container_name: olion-postgres    # 컨테이너 이름 (docker ps에서 보임)
    environment:                      # DB 초기 계정/이름 설정
      POSTGRES_DB: olion              # 만들 데이터베이스 이름
      POSTGRES_USER: olion            # 접속 계정
      POSTGRES_PASSWORD: olion        # 접속 비밀번호 (로컬 전용이라 단순하게)
    ports:
      - "5433:5432"                   # 내 컴퓨터의 5433 포트 → 컨테이너 5432 포트로 연결
                                      # (5432는 이미 로컬 Postgres.app 이 쓰고 있어 충돌 회피)
    volumes:
      - olion-db-data:/var/lib/postgresql/data   # 데이터를 디스크에 저장(컨테이너 지워도 데이터 보존)

volumes:
  olion-db-data:                      # 위에서 쓴 저장 공간 선언
