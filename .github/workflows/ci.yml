name: CI   # 워크플로 이름 (GitHub Actions 탭에 표시됨)

# 언제 실행할지: dev 브랜치로 가는 PR, 그리고 dev 에 push 될 때
on:
  pull_request:
    branches: [ "dev" ]
  push:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest   # GitHub 이 빌려주는 리눅스 가상 서버에서 실행

    steps:
      # 1) 저장소 코드를 서버로 내려받기
      - name: Checkout code
        uses: actions/checkout@v4

      # 2) JDK 21 설치 (build.gradle 의 자바 버전과 동일해야 함)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle        # gradle 의존성 캐시 → 빌드 속도 향상

      # 3) gradlew 실행 권한 부여 (리눅스에서 필요)
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 4) 빌드 + 테스트 (test 프로필로 H2 사용하므로 별도 DB 불필요)
      - name: Build and test
        run: ./gradlew build
